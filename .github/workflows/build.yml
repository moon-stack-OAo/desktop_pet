# 推送 tag 时构建 Windows 桌面应用并发布到 GitHub Release
# 示例：git tag v0.1.0 && git push origin v0.1.0
# PR / 主分支推送时跑 lint 门禁（E7）

name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: '可选：用于产物命名的版本号（如 v0.1.0）；留空则用 run id'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build-windows:
    name: Windows
    # 仅 tag 推送或手动触发时打包，避免每个 PR 都跑 electron-builder
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            RAW="${{ inputs.tag }}"
          else
            RAW="build-${{ github.run_number }}"
          fi
          # 去掉前缀 v，得到 semver 风格（若无 v 则原样）
          VER="${RAW#v}"
          echo "tag=$RAW" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$RAW version=$VER"

      - name: Sync package version (tag builds)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.env.VER;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('apps/desktop version ->', process.env.VER);
          "
        env:
          VER: ${{ steps.ver.outputs.version }}

      - name: Install dependencies
        run: npm ci
        env:
          # 加速 Electron 二进制下载（可选镜像；失败时可去掉）
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      # typecheck 会先 build packages（dist 未入库，CI 干净环境必须先构建）
      - name: Typecheck
        run: npm run typecheck

      - name: Pet-asset path smoke
        run: npm run test:pet-asset

      - name: Build renderer
        run: npm run build:renderer -w @pet/desktop

      - name: Package Windows (electron-builder)
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never
        env:
          # 避免 CI 上代码签名相关符号链接问题
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 生成 latest.yml 供 electron-updater 使用
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release artifacts
        shell: bash
        run: |
          ls -la apps/desktop/release || true
          find apps/desktop/release -maxdepth 2 -type f \( -name '*.exe' -o -name '*.yml' -o -name '*.blockmap' \) -print || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop_pet-windows-${{ steps.ver.outputs.tag }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Extract release notes from CHANGELOG
        if: github.ref_type == 'tag'
        id: notes
        shell: bash
        run: |
          node scripts/extract-changelog.js "${{ steps.ver.outputs.version }}" CHANGELOG.md release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create / update GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: desktop_pet ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 以 CHANGELOG 对应版本正文为主；并附带 GitHub 自动生成的提交摘要
          body_path: release-notes.md
          generate_release_notes: true
          # latest.yml / blockmap 为 electron-updater 必需
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
