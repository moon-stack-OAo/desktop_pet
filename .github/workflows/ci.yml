# PR / push 门禁：install → typecheck → smoke → 单测
# 当前仅 Windows（与 Electron 桌面目标一致）

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck / smoke / test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # typecheck 内含 build:packages（@pet/runtime dist 供 desktop 解析类型）
      - name: Typecheck
        run: npm run typecheck

      - name: Smoke (runtime + pet-asset)
        run: npm run smoke

      - name: Unit tests
        run: npm test
